name: Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    name: Build .NET 10 WebAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore chakra_api_back_end/Chakra.slnx

      - name: Build Solution (Zero Warning & Zero Error)
        run: dotnet build chakra_api_back_end/Chakra.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test chakra_api_back_end/Chakra.slnx --configuration Release --no-build

  frontend-build:
    name: Build Front-ends (Next.js & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            chakra_front_end/package-lock.json
            chakra_management_front_end/package-lock.json

      - name: Build Next.js Public Client
        run: |
          cd chakra_front_end
          npm ci --ignore-scripts
          npm run build

      - name: Build Vite Management Console
        run: |
          cd chakra_management_front_end
          npm ci --ignore-scripts
          npm run build
