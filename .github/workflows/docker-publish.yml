name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'chakra_api_back_end/**'
      - 'chakra_front_end/**'
      - 'chakra_management_front_end/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_PREFIX: ccr.ccs.tencentyun.com/tcb-100006869986-ccqi/dvvbhub

jobs:
  publish-images:
    name: Build & Push Images to Tencent TCR
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录腾讯云 TCR 镜像仓库
        env:
          TCR_USER: ${{ secrets.TCR_USERNAME }}
          TCR_PWD: ${{ secrets.TCR_PASSWORD }}
        run: |
          printf '%s\n' "$TCR_PWD" | docker login ${{ env.REGISTRY }} --username "$TCR_USER" --password-stdin

      - name: 1. 构建并推送 .NET 10 WebAPI 后端镜像
        run: |
          echo ">>> 正在构建 WebAPI 镜像 ..."
          docker build -t ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi ./chakra_api_back_end
          echo ">>> 正在推送 WebAPI 镜像至腾讯云 ..."
          docker push ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi

      - name: 2. 构建并推送 Next.js 博客展示端镜像
        run: |
          echo ">>> 正在构建展示端前端镜像 ..."
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            --build-arg INTERNAL_API_BASE_URL=http://blogapi:8080/api \
            -t ${{ env.IMAGE_PREFIX }}:chakra-blog-react ./chakra_front_end
          echo ">>> 正在推送展示端前端镜像至腾讯云 ..."
          docker push ${{ env.IMAGE_PREFIX }}:chakra-blog-react

      - name: 3. 构建并推送 React 管理后台前端镜像
        run: |
          echo ">>> 正在构建管理后台前端镜像 ..."
          docker build \
            --build-arg VITE_BLOG_FRONT_URL=http://localhost:3000 \
            -t ${{ env.IMAGE_PREFIX }}:chakra-blog-management ./chakra_management_front_end
          echo ">>> 正在推送管理后台前端镜像至腾讯云 ..."
          docker push ${{ env.IMAGE_PREFIX }}:chakra-blog-management

      - name: 镜像推送结果反馈
        run: |
          echo "=================================================="
          echo "✓ 3 大服务镜像已全量成功推送到腾讯云公开仓库！"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-react"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-management"
          echo "=================================================="
