name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'chakra_api_back_end/**'
      - 'chakra_front_end/**'
      - 'chakra_management_front_end/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dvvb258

# 开启 GitHub Packages 推送权限 (内置免配置)
permissions:
  contents: read
  packages: write

jobs:
  publish-service:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: chakra-blog-webapi
            context: ./chakra_api_back_end
            build_args: ""
          - name: chakra-blog-react
            context: ./chakra_front_end
            build_args: "--build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 --build-arg INTERNAL_API_BASE_URL=http://blogapi:8080/api"
          - name: chakra-blog-management
            context: ./chakra_management_front_end
            build_args: ""

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: 并行构建并推送 [${{ matrix.service.name }}]
        run: |
          echo ">>> 正在构建 ${{ matrix.service.name }} 镜像 ..."
          docker build ${{ matrix.service.build_args }} -t ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest ${{ matrix.service.context }}

          echo ">>> 正在秒级推送 ${{ matrix.service.name }} 至 GHCR (内网高速) ..."
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest

          echo "✓ [${{ matrix.service.name }}] 推送成功！"
