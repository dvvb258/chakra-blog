name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'chakra_api_back_end/**'
      - 'chakra_front_end/**'
      - 'chakra_management_front_end/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE_PREFIX: ccr.ccs.tencentyun.com/tcb-100006869986-ccqi/dvvbhub

jobs:
  publish-images:
    name: Build & Push Images to Tencent TCR
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx 缓存加速
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云 TCR 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: 1. 构建并推送 .NET 10 WebAPI 后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./chakra_api_back_end
          file: ./chakra_api_back_end/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi
            ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi-latest

      - name: 2. 构建并推送 Next.js 博客展示端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./chakra_front_end
          file: ./chakra_front_end/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            INTERNAL_API_BASE_URL=http://blogapi:8080/api
          tags: |
            ${{ env.IMAGE_PREFIX }}:chakra-blog-react
            ${{ env.IMAGE_PREFIX }}:chakra-blog-react-latest

      - name: 3. 构建并推送 React 管理后台前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./chakra_management_front_end
          file: ./chakra_management_front_end/Dockerfile
          push: true
          build-args: |
            VITE_BLOG_FRONT_URL=http://localhost:3000
          tags: |
            ${{ env.IMAGE_PREFIX }}:chakra-blog-management
            ${{ env.IMAGE_PREFIX }}:chakra-blog-management-latest

      - name: 镜像推送结果反馈
        run: |
          echo "=================================================="
          echo "✓ 3 大服务镜像已全量成功推送到腾讯云公开仓库！"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-webapi"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-react"
          echo " - ${{ env.IMAGE_PREFIX }}:chakra-blog-management"
          echo "=================================================="
