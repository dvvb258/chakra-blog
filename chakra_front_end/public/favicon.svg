<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- 昼夜双生渐变外环：鸣人金橙 -> 佐助冰蓝紫 -->
    <linearGradient id="chakraOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 核心旋涡能量金红渐变 -->
    <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- 查克拉能量辉光 -->
    <filter id="chakraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080c16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. 背景底座：深曜石黑机能圆角正方形 -->
  <rect width="128" height="128" rx="28" fill="#080c16" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="url(#chakraOuterRing)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- 2. 环内柔和查克拉暗光晕 -->
  <circle cx="64" cy="64" r="48" fill="url(#coreAura)" />

  <!-- 3. 查克拉双生能量外环 (半径 48，完全包裹，严密闭合) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#chakraOuterRing)" stroke-width="4.5" filter="url(#chakraGlow)" />

  <!-- 4. 核心：官方正统查克拉同心阿基米德旋涡 (scale 0.080，高度约 66px，与外环留出 15px 舒适空隙，饱满居中) -->
  <g transform="translate(64, 64) scale(0.080) translate(-270, -475)" filter="url(#chakraGlow)">
    <path
      fill="url(#vortexGrad)"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M 237.63 9.17 C 224.95 101.04 272.54 187.65 342.96 243.64 C 593.73 421.87 590.27 776.13 299.52 841.20 C 82.37 870.01 -4.84 730.39 12.04 579.22 C 11.32 394.94 217.19 334.27 311.78 404.28 C 463.16 523.06 377.91 732.85 201.84 698.77 C 156.39 683.02 134.91 598.95 172.44 550.67 C 213.51 499.03 290.52 552.57 263.11 576.25 C 242.29 608.25 298.74 595.31 298.99 533.19 C 284.03 416.33 112.44 441.07 83.65 548.51 C 52.38 691.33 132.09 805.27 302.26 777.33 C 494.20 730.09 494.55 428.48 318.04 302.32 C 228.64 236.09 190.63 110.06 237.63 9.17 Z"
    />
  </g>

  <!-- 5. 环上微型能量节点 (四极对称点缀) -->
  <circle cx="64" cy="16" r="2.5" fill="#f59e0b" />
  <circle cx="64" cy="112" r="2.5" fill="#06b6d4" />
  <circle cx="16" cy="64" r="2.5" fill="#ea580c" />
  <circle cx="112" cy="64" r="2.5" fill="#8b5cf6" />
</svg>
